<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecera('Editar Producto')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <main class="container mt-5 mb-5 flex-grow-1">
        <h1 class="h3 mb-4 fw-bold" style="color: var(--bs-dark);">Editar Producto</h1>

        <div class="row">
            <div class="col-12 col-md-8 col-lg-6">
              <form th:action="@{/productos/actualizar}" method="post">
    <input type="hidden" name="id" th:value="${producto.id}">

    <div class="mb-3">
        <label for="nombre" class="form-label fw-medium text-muted small text-uppercase">Nombre</label>
        <input type="text" name="nombre" class="form-control" id="nombre" th:value="${producto.nombre}" required>
    </div>
    <div class="mb-3">
        <label for="precio" class="form-label fw-medium text-muted small text-uppercase">Precio</label>
        <input type="number" step="0.10" name="precio" class="form-control" id="precio" th:value="${producto.precio}" required>
    </div>
    <div class="mb-3">
        <label for="stock" class="form-label fw-medium text-muted small text-uppercase">Stock</label>
        <input type="number" name="stock" class="form-control" id="stock" th:value="${producto.stock}" required>
    </div>
    <div class="mb-4">
        <label for="categoria" class="form-label fw-medium text-muted small text-uppercase">Categoría</label>
        <select name="categoria" class="form-select" id="categoria" required>
            <option th:each="cat : ${categorias}" 
                    th:value="${cat.nombre}" 
                    th:text="${cat.nombre}" 
                    th:selected="${cat.nombre == producto.categoria}"></option>
        </select>
    </div>
    <button type="submit" class="btn btn-primary me-2">Guardar Cambios</button>
    <a th:href="@{/productos}" class="btn btn-outline-secondary">Cancelar</a>
</form>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
