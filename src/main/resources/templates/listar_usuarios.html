<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecera('Gestión de Personal')}"></head>
<body>

    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="container mt-5 mb-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="h3 mb-0 fw-bold" style="color: var(--bs-dark);">Gestión de Personal</h2>
                    <a th:href="@{/usuarios/crear}" class="btn btn-primary shadow-sm">Registrar Colaborador</a>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th scope="col" class="ps-4 py-3 border-0">ID</th>
                                        <th scope="col" class="py-3 border-0">Nombre Completo</th>
                                        <th scope="col" class="py-3 border-0">Correo Corporativo</th>
                                        <th scope="col" class="py-3 border-0 text-center">Rol</th>
                                        <th scope="col" class="py-3 border-0 text-center">Acceso</th>
                                        <th scope="col" class="text-center py-3 border-0">Acciones</th>
                                    </tr>
                                </thead>
                              <tbody>
                                    <tr th:each="user : ${usuarios}">
                                        <th scope="row" class="ps-4 text-muted" th:text="${user.id}">EMP-0001</th>
                                        <td class="fw-medium" th:text="${user.nombre}">Satoru Gojo</td>
                                        <td class="text-muted small" th:text="${user.correo}">u23257285@automarket.pe</td>
                                        <td class="text-center">
                                            <span th:text="${user.rol}" 
                                                  th:class="${user.rol == 'Supervisor'} ? 'badge bg-dark bg-opacity-10 text-dark border border-dark px-2 py-1' : 'badge bg-primary bg-opacity-10 text-primary border border-primary px-2 py-1'">
                                                Cajero
                                            </span>
                                        </td>
                                        <td class="text-center">
                                            <span th:if="${user.activo}" class="badge bg-success bg-opacity-10 text-success border border-success px-2 py-1">Activo</span>
                                            <span th:unless="${user.activo}" class="badge bg-secondary bg-opacity-10 text-secondary border border-secondary px-2 py-1">Suspendido</span>
                                        </td>
                                        <td class="text-center">
                                            <a th:href="@{/usuarios/editar/{id}(id=${user.id})}" class="btn btn-sm btn-outline-secondary fw-bold">Modificar</a>
                                            <a th:href="@{/usuarios/cambiar-estado/{id}(id=${user.id})}" 
   class="btn btn-sm btn-outline-danger fw-bold" 
   th:text="${user.activo} ? 'Bloquear' : 'Desbloquear'">Bloquear</a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
