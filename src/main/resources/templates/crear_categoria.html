<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecera('Nueva Categoría')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <main class="container mt-5 mb-5 flex-grow-1">
        <h1 class="h3 mb-4 fw-bold" style="color: var(--bs-dark);">Nueva Categoría</h1>

        <div class="row">
            <div class="col-12 col-md-8 col-lg-6">
                <form th:action="@{/categorias/guardar}" method="post">
    <div class="mb-3">
        <label for="nombreCategoria" class="form-label fw-medium text-muted small text-uppercase">Nombre de Categoría</label>
        <input type="text" name="nombre" class="form-control" id="nombreCategoria" placeholder="Ej. Bebidas" required>
    </div>
    <div class="mb-4">
        <label for="descripcionCategoria" class="form-label fw-medium text-muted small text-uppercase">Descripción</label>
        <textarea name="descripcion" class="form-control" id="descripcionCategoria" rows="3" placeholder="Breve descripción" required></textarea>
    </div>
    <button type="submit" class="btn btn-primary me-2">Guardar</button>
    <a th:href="@{/categorias}" class="btn btn-outline-secondary">Cancelar</a>
</form>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
