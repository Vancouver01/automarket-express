<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecera('Panel Principal')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <main class="container">
        <div class="text-center my-5">
            <h1 class="fw-bold text-dark">Panel de Administración</h1>
            <p class="text-muted">Seleccione un módulo para gestionar el minimarket</p>
        </div>
        <div class="row g-4 justify-content-center">
            <div class="col-md-4">
                <div class="card text-center p-4">
                    <img th:src="@{/assets/imagenes/icono_inventario.png}" alt="Inventario" width="64" class="mx-auto mb-3">
                    <h5 class="fw-bold text-dark">Inventario</h5>
                    <p class="text-muted small">Gestione los productos y categorías disponibles</p>
                    <a th:href="@{/productos}" class="btn btn-outline-secondary w-100 mt-2">Acceder</a>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center p-4 border-primary">
                    <img th:src="@{/assets/imagenes/icono_caja.png}" alt="Caja Rápida" width="64" class="mx-auto mb-3">
                    <h5 class="fw-bold text-dark">Autopago</h5>
                    <p class="text-muted small">Módulo operativo de ventas para clientes</p>
                    <a th:href="@{/caja}" class="btn btn-primary w-100 mt-2">Abrir Terminal</a>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center p-4">
                    <img th:src="@{/assets/imagenes/icono_metricas.png}" alt="Métricas" width="64" class="mx-auto mb-3">
                    <h5 class="fw-bold text-dark">Analítica</h5>
                    <p class="text-muted small">Visualice el rendimiento y reportes de ventas</p>
                    <a th:href="@{/metricas}" class="btn btn-outline-secondary w-100 mt-2">Ver Reportes</a>
                </div>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
