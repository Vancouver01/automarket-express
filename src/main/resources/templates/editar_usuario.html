<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecera('Modificar Colaborador')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <main class="container mt-5 mb-5 flex-grow-1">
        <h1 class="h3 mb-4 fw-bold" style="color: var(--bs-dark);">Modificar Colaborador</h1>

        <div class="row">
            <div class="col-12 col-md-8 col-lg-6">
                <form th:action="@{/usuarios/actualizar}" method="post">
    <input type="hidden" name="id" th:value="${usuario.id}">

    <div class="mb-3">
        <label for="nombre" class="form-label fw-medium text-muted small text-uppercase">Nombre Completo</label>
        <input type="text" name="nombre" class="form-control" id="nombre" th:value="${usuario.nombre}" required>
    </div>
    <div class="mb-3">
        <label for="correo" class="form-label fw-medium text-muted small text-uppercase">Correo Corporativo</label>
        <input type="email" name="correo" class="form-control" id="correo" th:value="${usuario.correo}" required>
    </div>
    <div class="mb-4">
        <label for="rol" class="form-label fw-medium text-muted small text-uppercase">Rol</label>
        <select name="rol" class="form-select" id="rol" required>
            <option value="Cajero" th:selected="${usuario.rol == 'Cajero'}">Cajero</option>
            <option value="Supervisor" th:selected="${usuario.rol == 'Supervisor'}">Supervisor</option>
        </select>
    </div>
    <button type="submit" class="btn btn-primary me-2">Guardar Cambios</button>
    <a th:href="@{/usuarios}" class="btn btn-outline-secondary">Cancelar</a>
</form>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
