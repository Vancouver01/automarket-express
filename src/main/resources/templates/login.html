<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema | AutoMarket Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bs-primary: #36C9C6;
            --bs-light: #F8F9FA;
            --bs-dark: #2C3E50;
            font-family: 'Inter', sans-serif;
        }

        body { 
            background: url('/assets/imagenes/fondo_login.png') no-repeat center center fixed; 
            background-size: cover; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .login-card { 
            border-radius: 20px; 
            overflow: hidden; 
            border: none; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); 
        }
    
        .brand-panel { 
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.8)), url('/assets/imagenes/panel_login.png') no-repeat center center;
            background-size: cover;
            color: white; 
        }
        .form-control { border-radius: 8px; padding: 12px 15px; border: 1px solid #dee2e6; }
        .form-control:focus { border-color: var(--bs-primary); box-shadow: 0 0 0 0.25rem rgba(54, 201, 198, 0.25); }
        .btn-primary { background-color: var(--bs-primary); border: none; border-radius: 8px; font-weight: 600; letter-spacing: 0.5px; }
        .btn-primary:hover { background-color: #2BA09E; }
    </style>
</head>
<body>
    <div class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="card login-card w-100" style="max-width: 900px;">
            <div class="row g-0">
                <div class="col-md-6 brand-panel d-none d-md-flex flex-column justify-content-center align-items-center p-5 text-center">
                    <h1 class="fw-bold mb-3">AutoMarket</h1>
                    <p class="lead fw-medium mb-0">Plataforma de Gestión y Autopago</p>
                    <p class="small opacity-75 mt-4">2026</p>
                </div>
 
                <div class="col-md-6 p-5 bg-white">
                    <div class="mb-5 text-center text-md-start">
                        <h3 class="fw-bold text-dark mb-1">Bienvenido de vuelta :></h3>
                        <p class="text-muted">Por favor ingrese sus credenciales de acceso</p>
                    </div>
                    
                   <form th:action="@{/login}" method="post">
    <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>
    <div class="mb-3">
        <label class="form-label small text-muted">ID DE COLABORADOR</label>
        <input type="text" name="id" class="form-control" placeholder="Ej: EMP-0001" required>
    </div>
    <div class="mb-3">
        <label class="form-label small text-muted">CONTRASEÑA DE SEGURIDAD</label>
        <input type="password" name="password" class="form-control" placeholder="********" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Ingresar al Sistema</button>
</form>
                </div>
            </div>
        </div>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
