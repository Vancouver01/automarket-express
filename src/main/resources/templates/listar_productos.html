<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecera('Gestión de Inventario')}"></head>
<body>

    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="container mt-5 mb-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="h3 mb-0 fw-bold" style="color: var(--bs-dark);">Gestión de Inventario</h2>
                    <a th:href="@{/productos/crear}" class="btn btn-primary shadow-sm">Registrar Producto</a>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th scope="col" class="ps-4 py-3 border-0">#</th>
                                        <th scope="col" class="py-3 border-0">Nombre del Artículo</th>
                                        <th scope="col" class="py-3 border-0">Categoría</th>
                                        <th scope="col" class="py-3 border-0">Precio Unit.</th>
                                        <th scope="col" class="py-3 border-0 text-center">Stock</th>
                                        <th scope="col" class="text-center py-3 border-0">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="prod : ${productos}">
                                        <th scope="row" class="ps-4" th:text="${prod.id}">1</th>
                                        <td class="fw-medium" th:text="${prod.nombre}">Inca Kola 600ml</td>
                                        <td class="text-muted" th:text="${prod.categoria}">Bebidas</td>
                                        <td class="fw-bold text-success" th:text="'S/ ' + ${#numbers.formatDecimal(prod.precio, 1, 2)}">S/ 3.50</td>
                                        <td class="text-center" th:text="${prod.stock}">120</td>
                                        <td class="text-center">
                                           <a th:href="@{/productos/editar/{id}(id=${prod.id})}" class="btn btn-sm btn-outline-secondary fw-bold">Editar</a>
                                            <a th:href="@{/productos/cambiar-estado/{id}(id=${prod.id})}" 
   class="btn btn-sm btn-outline-danger fw-bold" 
   th:text="${prod.activo} ? 'Ocultar' : 'Activar'">Ocultar</a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
