<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecera('Gestión de Categorías')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <main class="container mt-5 mb-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="h3 mb-0 fw-bold" style="color: var(--bs-dark);">Gestión de Categorías</h2>
                    <a th:href="@{/categorias/crear}" class="btn btn-primary shadow-sm">Nueva Categoría</a>
                </div>
                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th scope="col" class="ps-4 py-3 border-0">#</th>
                                        <th scope="col" class="py-3 border-0">Nombre</th>
                                        <th scope="col" class="py-3 border-0">Descripción</th>
                                        <th scope="col" class="py-3 border-0">Estado</th>
                                        <th scope="col" class="text-center py-3 border-0">Acciones</th>
                                    </tr>
                                </thead>
                               <tbody>
                                    <tr th:each="cat : ${categorias}">
                                        <th scope="row" class="ps-4" th:text="${cat.id}">1</th>
                                        <td class="fw-medium" th:text="${cat.nombre}">Bebidas</td>
                                        <td class="text-muted" th:text="${cat.descripcion}">Gaseosas, jugos y aguas</td>
                                        <td>
                                            <span th:if="${cat.activo}" class="badge bg-success bg-opacity-10 text-success border border-success px-2 py-1">Activo</span>
                                            <span th:unless="${cat.activo}" class="badge bg-secondary bg-opacity-10 text-secondary border border-secondary px-2 py-1">Oculto</span>
                                        </td>
                                        <td class="text-center">
                                            <a th:href="@{/categorias/editar/{id}(id=${cat.id})}" class="btn btn-sm btn-outline-secondary fw-bold">Editar</a>
                                            <a th:href="@{/categorias/cambiar-estado/{id}(id=${cat.id})}" 
   class="btn btn-sm btn-outline-danger fw-bold" 
   th:text="${cat.activo} ? 'Ocultar' : 'Activar'">Ocultar</a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
